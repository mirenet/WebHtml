<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Player</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: black;
}
#player {
width: 100%;
height: 100%;
}
</style>
<script>
// Uzimamo 'video' parametar iz URL-a (npr. ?video=...)
const urlParams = new URLSearchParams(window.location.search);
let videoParam = urlParams.get('video') || "";

let videoId = "";
try {
    const parsedUrl = new URL(videoParam);
    if (parsedUrl.hostname.includes('youtube.com')) {
        if (parsedUrl.pathname.startsWith('/embed/') || parsedUrl.pathname.startsWith('/shorts/')) {
            videoId = parsedUrl.pathname.split('/')[2];
        } else {
            videoId = parsedUrl.searchParams.get('v');
        }
    } else if (parsedUrl.hostname === 'youtu.be') {
        videoId = parsedUrl.pathname.slice(1);
    }
} catch (e) {
    videoId = videoParam;
}

if (videoId && videoId.includes('?')) {
    videoId = videoId.split('?')[0];
}

// Validacija ID-ja
if (!videoId || !/^[a-zA-Z0-9_-]{5,20}$/.test(videoId)) {
    document.body.innerHTML = "<div style='color:white;text-align:center;padding-top:20vh;font-family:sans-serif;'>Wrong video-id or Not Found!</div>";
} else {
    let player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
            width: "100%",
            height: "100%",
            videoId: videoId,
            playerVars: {
                autoplay: 1,
                controls: 0,
                playsinline: 1,
                rel: 0
            },
            events: {
                onReady: onReady,
                onStateChange: onStateChange,
                onError: onError
            }
        });
    }
    function onReady(event) {
        event.target.playVideo();
    }
    function onStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            parent.postMessage({ type: "ended" }, "*");
        }
    }
    const errorMessages = {
        2: "Wrong video-id!",
        5: "Error with player!",
        100: "Video not found!",
        101: "Embed is not allowed!",
        150: "Embed is not allowed!"
    };
    function onError(event) {
        const code = event.data;
        const message = errorMessages[code] || ('Cant play video! (Error: ' + code + ')');
        parent.postMessage({
            type: "error",
            message: message
        }, "*");
    }
}
</script>
</head>
<body>
<div id="player"></div>
</body>
</html>
